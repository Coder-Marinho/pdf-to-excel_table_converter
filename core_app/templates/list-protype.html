<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><body></title>
  <style>
    /* Reset & base styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070708;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Layout canvas container */
    .canvas-container {
      position: relative;
      width: 1600px;
      height: 900px;
    }

    /* Generated Layers CSS */
    .body {
      width: 1600px;
      height: 900px;
      position: absolute;
      left: 0px;
      top: 0px;
      background-color: #262626;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <div class="body"></div>
  </div>
</body>
</html>
